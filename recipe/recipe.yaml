# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.0.0"
  python_check_max: "3.15"

package:
  name: croniter
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/croniter/croniter-${{ version }}.tar.gz
  sha256: a0b2568303c774f6a4ea2d4ce2e72b1ee911029c7070d64a1befe05cdb107f5a

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - hatchling >=1.33.0
    - packaging >=26.0
    - pathspec >=1.1.1
    - pip
    - pluggy >=1.7.0
    - python ${{ python_min }}.*
    - trove-classifiers >=2026.9.21.13
  run:
    - python >=${{ python_min }}
    - python-dateutil
    # undeclared and lazily imported
    - pytz

tests:
  - package_contents:
      strict: true
      site_packages:
        - croniter/**
        - croniter-${{ version }}.dist-info/**
  - python:
      imports: croniter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - pytest-cov
        - python ${{ python_min }}.*
    script:
      - coverage run --source=croniter --branch -m pytest -vv --tb=long --color=yes --pyargs croniter
      - coverage report --show-missing --skip-covered --fail-under=92

about:
  license: MIT
  license_file: LICENSE
  summary: croniter provides iteration for datetime object with cron like format
  homepage: https://pypi.org/project/croniter
  repository: https://github.com/pallets-eco/croniter

extra:
  recipe-maintainers:
    - mariusvniekerk
    - bollwyvl
